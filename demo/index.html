<style>
/* Layout: Discord style group rail on the left, one content area. Phone: bottom tabs (Home, Groups, Calendar, You). */
:root {
  --maroon: #8466FF; --maroon-2: #9A82FF; --maroon-soft: rgba(132, 102, 255, .2); --accent: #B9A8FF; --cyan: #3FD0F0;
  --bg: transparent; --app: rgba(8, 10, 26, .72); --solid: #0C1028; --panel: rgba(12, 15, 38, .82); --surface: rgba(20, 25, 58, .78); --ink: #EEF0FF; --muted: #A3ABD1; --line: #252D5C; --bubble: #1B2252;
  --free: #3FD99A; --free-soft: rgba(63, 217, 154, .16); --gaming: #34B7C6; --out: #F09350; --watch: #D6B25F; --gym: #A08CFF; --busy: #7C83A6;
  --shadow: 0 20px 50px -12px rgba(0, 0, 0, .7), 0 0 0 1px rgba(185, 168, 255, .08);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overscroll-behavior: none; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -.02em; text-wrap: balance; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }

#shell { height: 100%; height: 100dvh; display: grid; grid-template-columns: 76px 1fr; }
/* rail */
.rail { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px 0; padding-top: calc(14px + env(safe-area-inset-top, 0px)); overflow-y: auto; }
.rbtn { position: relative; width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; font-size: 22px; background: var(--surface); border: 1px solid var(--line); transition: border-radius .2s, transform .2s; flex: none; }
.rbtn:hover { border-radius: 14px; transform: translateY(-1px); }
.rbtn.home { background: radial-gradient(circle at 30% 25%, #3A2A90, #0B0E20 80%); border: 1px solid rgba(185,168,255,.35); }
.rbtn.home svg { overflow: visible; }
.rbtn.home svg { width: 26px; height: 26px; }
.rbtn svg.ico { width: 22px; height: 22px; color: var(--muted); }
.rbtn[aria-current="page"]::before { content: ""; position: absolute; left: -14px; top: 10px; bottom: 10px; width: 5px; border-radius: 0 4px 4px 0; background: var(--ink); }
.rbtn[aria-current="page"] { box-shadow: 0 0 0 2px var(--ink); }
.rbtn .badge { position: absolute; right: -5px; top: -5px; min-width: 19px; height: 19px; border-radius: 999px; background: var(--maroon); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; border: 2px solid var(--panel); }
.rail hr { width: 32px; border: 0; border-top: 2px solid var(--line); margin: 2px 0; }
.rail .you { margin-top: auto; }
.tip { position: relative; }

main { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--app); backdrop-filter: blur(2px); }
.top { display: flex; align-items: center; gap: 12px; padding: 14px 22px; border-bottom: 1px solid var(--line); min-height: 66px; padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
.top h1 { font-size: 22px; }
.top .grow { flex: 1; min-width: 0; }
.gicon { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-size: 21px; background: var(--bubble); flex: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; padding: 9px 16px; font-weight: 700; font-size: 14px; white-space: nowrap; transition: transform .15s, background .2s; }
.btn:active { transform: scale(.97); }
.btn.primary { background: linear-gradient(135deg, #8A6BFF, #5B3BD1); color: #fff; box-shadow: 0 6px 18px -6px rgba(124,92,255,.7); }
.btn.primary:hover { background: var(--maroon-2); }
.btn.line { border: 1px solid var(--line); background: var(--surface); }
.btn.go { background: var(--free); color: #fff; }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 18px; flex: none; }
.tabs { display: flex; gap: 4px; padding: 0 18px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { white-space: nowrap; }
/* files + reminders */
.photo { display: block; max-width: min(280px, 100%); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); }
.photo img { display: block; width: 100%; max-height: 320px; object-fit: cover; }
.filecard { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: inherit; width: min(320px, 100%); text-align: left; }
.filecard:hover { background: var(--panel); }
.fileicon { width: 42px; height: 48px; border-radius: 8px; background: var(--maroon); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; flex: none; letter-spacing: .04em; }
.fileicon.doc { background: #2B62F0; } .fileicon.sheet { background: #17905A; } .fileicon.other { background: #5A5A63; }
.filecard .t { flex: 1; min-width: 0; }
.filecard b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.gallery button { aspect-ratio: 1; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
.gallery img { width: 100%; height: 100%; object-fit: cover; display: block; }
.drop { outline: 3px dashed var(--maroon); outline-offset: -10px; }
.rems { display: flex; flex-direction: column; gap: 8px; }
.rem { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.rem .e { width: 40px; height: 40px; border-radius: 12px; background: var(--bubble); display: grid; place-items: center; font-size: 20px; flex: none; }
.rem .t { flex: 1; min-width: 0; }
.rem .t b { display: block; }
.rem.done { opacity: .55; } .rem.done b { text-decoration: line-through; }
.check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; color: transparent; font-weight: 800; }
.check[aria-pressed="true"] { background: var(--free); border-color: var(--free); color: #fff; }
.viewer { background: #000; border-radius: 20px; overflow: hidden; max-width: min(900px, 100%); max-height: 90vh; display: flex; flex-direction: column; }
.viewer img { max-width: 100%; max-height: calc(90vh - 52px); object-fit: contain; display: block; margin: auto; }
.viewer .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; color: #fff; }
.tabs button { padding: 12px 12px 11px; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button[aria-current="true"] { color: var(--ink); border-bottom-color: var(--maroon); }
.scroll { flex: 1; min-height: 0; overflow-y: auto; }
.pad { padding: 22px; display: flex; flex-direction: column; gap: 28px; max-width: 860px; }
/* simple rows */
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.lrow { display: flex; align-items: center; gap: 14px; padding: 14px 16px; text-align: left; width: 100%; min-width: 0; }
.lrow + .lrow { border-top: 1px solid var(--line); }
button.lrow:hover { background: var(--panel); }
.lrow .tile { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 24px; flex: none; }
.lrow .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.lrow .t b { font-size: 16.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lrow .t .note { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { font-size: 13px; font-weight: 700; padding: 5px 11px; border-radius: 999px; background: var(--panel); color: var(--muted); flex: none; white-space: nowrap; }
.chip.g { background: var(--free-soft); color: var(--free); }
.chip.m { background: color-mix(in srgb, #C98A12 18%, transparent); color: #A86F00; }
.hello { font-family: var(--display); font-size: 26px; font-weight: 700; line-height: 1.2; }
.hello + .note { margin-top: -20px; font-size: 15px; }
.hpill { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; white-space: nowrap; }
.hpill[aria-pressed="true"] { background: var(--free); color: #fff; border-color: transparent; }

/* avatars */
.av { width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; position: relative; flex: none; }
.av .dot { position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--app); }
.stack { display: inline-flex; }
.stack .av { border: 2px solid var(--surface); width: 28px; height: 28px; font-size: 11px; }
.stack .av + .av { margin-left: -8px; }

/* home */
.welcome { background: linear-gradient(135deg, #3B26A0, #7C5CFF); color: #fff; border-radius: 22px; padding: 20px 22px; display: grid; grid-template-columns: 1fr auto; gap: 14px; }
.welcome h2 { font-size: 22px; }
.welcome ol { margin: 8px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; opacity: .92; }
.welcome .x { align-self: start; color: #fff; opacity: .8; font-size: 22px; }
.sec { display: flex; flex-direction: column; gap: 12px; }
.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sechead h2 { font-size: 20px; }
.strip { display: flex; gap: 16px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: thin; }
.person { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 76px; flex: none; text-align: center; }
.ring { width: 64px; height: 64px; border-radius: 50%; padding: 3px; display: grid; place-items: center; background: var(--line); }
.ring .av { width: 100%; height: 100%; font-size: 20px; border: 3px solid var(--app); }
.ring.add { background: transparent; border: 2px dashed var(--line); }
.person b { font-size: 13px; }
.person small { font-size: 11.5px; color: var(--muted); line-height: 1.2; }
.events { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.ev { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; text-align: left; transition: transform .2s, box-shadow .2s; min-width: 0; }
.ev:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.cover { height: 88px; display: flex; align-items: flex-end; justify-content: space-between; padding: 12px 14px; color: #fff; position: relative; }
.cover .emo { font-size: 38px; line-height: 1; filter: drop-shadow(0 4px 8px rgba(0,0,0,.25)); }
.cover .when { background: rgba(255,255,255,.18); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); padding: 5px 10px; border-radius: 999px; font-weight: 700; font-size: 12.5px; }
.ev .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.ev .title { font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.15; }
.ev .meta { font-size: 13px; color: var(--muted); }
.ev .row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.ev .row b { color: var(--ink); }
.rsvp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: auto; }
.rsvp button { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 8px 2px; font-weight: 700; font-size: 13px; }
.rsvp button[aria-pressed="true"].rg { background: var(--free); border-color: var(--free); color: #fff; }
.rsvp button[aria-pressed="true"].rm { background: var(--watch); border-color: var(--watch); color: #fff; }
.rsvp button[aria-pressed="true"].rc { background: var(--busy); border-color: var(--busy); color: #fff; }
.grows { display: flex; flex-direction: column; gap: 8px; }
.grow-row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); text-align: left; width: 100%; }
.grow-row:hover { background: var(--panel); }
.grow-row .t { flex: 1; min-width: 0; }
.grow-row b { display: block; }
.grow-row .last { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { background: var(--maroon); color: #fff; font-size: 11.5px; font-weight: 700; border-radius: 999px; min-width: 22px; height: 22px; padding: 0 7px; display: grid; place-items: center; }

/* group chat */
.gwrap { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; }
.chat { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; }
.day { text-align: center; margin: 14px 0 8px; font-size: 12px; font-weight: 700; color: var(--muted); }
.sys { text-align: center; font-size: 12.5px; color: var(--muted); margin: 6px 0; }
.m { display: flex; gap: 10px; align-items: flex-end; margin-top: 6px; }
.m.me { flex-direction: row-reverse; }
.m .who { font-size: 12px; font-weight: 700; color: var(--muted); margin: 0 0 2px 4px; }
.m.me .who { display: none; }
.bwrap { display: flex; flex-direction: column; max-width: min(70%, 520px); min-width: 0; }
.m.me .bwrap { align-items: flex-end; }
.bub { background: var(--bubble); padding: 9px 13px; border-radius: 18px 18px 18px 6px; overflow-wrap: anywhere; position: relative; }
.m.me .bub { background: linear-gradient(135deg, #7C5CFF, #5B3BD1); color: #fff; border-radius: 18px 18px 6px 18px; }
.meta2 { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); margin: 3px 6px 0; }
.like { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; color: var(--muted); border-radius: 999px; padding: 1px 6px; }
.like[aria-pressed="true"] { color: var(--maroon); background: var(--maroon-soft); }
:root[data-theme="dark"] .like[aria-pressed="true"] { color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .like[aria-pressed="true"] { color: var(--accent); } }
.like svg { width: 14px; height: 14px; }
.mk { font-weight: 700; color: var(--accent); }
.minicard { width: min(360px, 100%); }
.poll { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; width: min(360px, 100%); display: flex; flex-direction: column; gap: 8px; }
.poll b { font-size: 15px; }
.opt { position: relative; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; text-align: left; overflow: hidden; display: flex; justify-content: space-between; gap: 10px; font-weight: 600; }
.opt .bar { position: absolute; inset: 0 auto 0 0; background: var(--maroon-soft); z-index: 0; transition: width .4s; }
.opt span { position: relative; z-index: 1; }
.opt[aria-pressed="true"] { border-color: var(--maroon); }
.composer { display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); position: relative; }
.composer input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 11px 16px; }
.plus { width: 40px; height: 40px; border-radius: 50%; background: var(--bubble); font-size: 22px; display: grid; place-items: center; flex: none; }
.send { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #8A6BFF, #3FA8E0); color: #fff; display: grid; place-items: center; flex: none; }
.menu { position: absolute; left: 14px; bottom: 64px; background: var(--solid); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 6px; display: flex; flex-direction: column; min-width: 190px; z-index: 5; }
.menu button { text-align: left; padding: 10px 12px; border-radius: 10px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
.menu button:hover { background: var(--panel); }
.side { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.hang { display: flex; flex-direction: column; gap: 10px; }
.hang-top { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.live { width: 9px; height: 9px; border-radius: 50%; background: var(--free); animation: ping 2s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(23,144,90,.5); } 70% { box-shadow: 0 0 0 8px rgba(23,144,90,0); } 100% { box-shadow: 0 0 0 0 rgba(23,144,90,0); } }
.hang-strip { display: none; }
.prow { display: flex; align-items: center; gap: 10px; }
.prow .n { flex: 1; min-width: 0; font-weight: 600; }
.prow .s { font-size: 12.5px; color: var(--muted); text-align: right; }
.members { padding: 22px; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; max-width: 1100px; }
.members .prow { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }

/* calendar */
.calwrap { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 340px; }
.calmain { overflow-y: auto; padding: 18px 22px 30px; min-width: 0; }
.calhead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.calhead h2 { flex: 1; font-size: 24px; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.dow { background: var(--panel); padding: 8px; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.cell { background: var(--surface); min-height: 96px; padding: 6px; text-align: left; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cell.out { background: var(--panel); }
.cell.out .dn { opacity: .4; }
.cell .dn { font-size: 13px; font-weight: 700; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.cell.today .dn { background: var(--maroon); color: #fff; }
.cell[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--maroon); }
.chipev { font-size: 11.5px; font-weight: 600; padding: 2px 6px; border-radius: 6px; background: var(--maroon-soft); color: var(--maroon); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
:root[data-theme="dark"] .chipev { color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chipev { color: var(--accent); } }
.agenda { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.agenda h3 { font-size: 20px; }
.empty { padding: 18px; border: 1px dashed var(--line); border-radius: 16px; color: var(--muted); font-size: 14px; text-align: center; }

/* overlays */
.ov { position: fixed; inset: 0; background: rgba(10, 10, 12, .5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.sheet { background: var(--solid); border: 1px solid var(--line); width: min(520px, 100%); max-height: 92vh; overflow-y: auto; border-radius: 24px; box-shadow: var(--shadow); display: flex; flex-direction: column; }
.sheet .in { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.sheet h2 { font-size: 24px; }
.field { display: flex; flex-direction: column; gap: 7px; }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 10px 12px; width: 100%; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 13px; font-weight: 600; font-size: 13.5px; }

  function viewCalendar() {
    const [y, m] = UI.cal.split('-').map(Number);
    const first = new Date(y, m - 1, 1), start = addDays(first, -first.getDay());
    const total = Math.ceil((first.getDay() + new Date(y, m, 0).getDate()) / 7) * 7;
    let cells = '';
    for (let i = 0; i < total; i++) {
      const d = addDays(start, i), ds = ymd(d), es = eventsOn(ds), out = d.getMonth() !== m - 1;
      cells += `<button class="cell ${out ? 'out' : ''} ${ds === today() ? 'today' : ''}" data-act="pickday" data-day="${ds}" aria-pressed="${ds === UI.day}" aria-label="${fmtDay(ds)}, ${es.length} events"><span class="dn">${d.getDate()}</span>${es.slice(0, 2).map(e => `<span class="chipev">${e.emoji} ${esc(e.title)}</span>`).join('')}${es.length > 2 ? `<span class="note" style="font-size:11px">+${es.length - 2} more</span>` : ''}</button>`;
    }
    const dayEv = eventsOn(UI.day);
    const body = `<div class="calwrap"><div class="calmain">
      <div class="calhead"><button class="iconbtn" data-act="mon" data-d="-1" aria-label="Previous month">‹</button><h2>${MONTHS[m - 1]} ${y}</h2><button class="btn line" data-act="mon" data-d="0">Today</button><button class="iconbtn" data-act="mon" data-d="1" aria-label="Next month">›</button></div>
      <div class="grid">${DOW.map(d => `<div class="dow">${d}</div>`).join('')}${cells}</div></div>
      <aside class="agenda"><h3>${esc(fmtDay(UI.day))}</h3>${dayEv.length ? dayEv.map(e => eventCard(e, UI.day)).join('') : '<div class="empty">Nothing planned yet.</div>'}
        ${(() => { const rs = S.reminders.filter(r => remOn(r, UI.day)).sort((a, b) => (a.time || '').localeCompare(b.time || '')); return rs.length ? `<span class="label">Reminders</span><div class="rems">${rs.map(r => remRow(r, UI.day)).join('')}</div>` : ''; })()}
        <button class="btn line" data-act="newreminder" data-date="${UI.day}">+ Reminder on ${esc(fmtDay(UI.day))}</button>
        <button class="btn primary" data-act="newevent" data-date="${UI.day}">+ Plan something on ${esc(fmtDay(UI.day))}</button></aside></div>`;
    return { head: `<div class="grow"><h1>Calendar</h1></div><button class="btn primary" data-act="newevent" data-date="${UI.day}">+ New event</button>`, body };
  }

  }
  function nextRem(r) {
    for (let i = 0; i < 60; i++) { const day = ymd(addDays(new Date(), i)); if (!remOn(r, day) || r.doneOn[day]) continue; return day; }
    return null;
  }
  const remWhen = (r, day) => `${fmtDay(day)}${r.time ? ', ' + fmtTime(r.time) : ''}${r.repeat ? ' · ' + REPEAT[r.repeat] : ''}`;
  function remRow(r, day) {
    const done = !!r.doneOn[day], g = r.group ? grp(r.group) : null;
    return `<div class="rem ${done ? 'done' : ''}"><span class="e">${r.emoji}</span><div class="t"><b>${esc(r.title)}</b><span class="note">${esc(remWhen(r, day))}${g ? ` · shared with ${g.emoji} ${esc(g.name)}` : ''}</span></div>
      <button class="check" data-act="remdone" data-r="${r.id}" data-day="${day}" aria-pressed="${done}" aria-label="Mark done">✓</button><button class="iconbtn" data-act="remdel" data-r="${r.id}" aria-label="Delete reminder" style="width:32px;height:32px;font-size:15px">×</button></div>`;
  }
  function remList(limit) {
    const items = S.reminders.map(r => { const t = today(); const d = remOn(r, t) ? t : nextRem(r); return d ? { r, d } : null; }).filter(Boolean)
      .sort((a, b) => (a.d + (a.r.time || '')).localeCompare(b.d + (b.r.time || '')));
    return items.slice(0, limit || 99);
  }
  function setEventReminder(e, v) {
    S.reminders = S.reminders.filter(r => r.event !== e.id);
    if (!v) return;
    const d = nextDate(e) || e.date; let day = d, time = e.time || '09:00';
    if (v === '1d') day = ymd(addDays(parseYmd(d), -1));
    else { const [h, m] = (e.time || '12:00').split(':').map(Number); const mins = h * 60 + m - (v === '2h' ? 120 : 30); time = `${pad2(Math.floor(Math.max(0, mins) / 60))}:${pad2(Math.max(0, mins) % 60)}`; }
    S.reminders.push({ id: 'r' + uid(), emoji: e.emoji, title: e.title, date: day, time, repeat: '', group: '', event: e.id, doneOn: {} });
  }
  function fileKind(f) { if (f.type.startsWith('image/')) return 'image'; if (/pdf/.test(f.type) || /\.pdf$/i.test(f.name)) return 'pdf'; if (/word|document/.test(f.type) || /\.docx?$/i.test(f.name)) return 'doc'; if (/sheet|excel|csv/.test(f.type) || /\.(xlsx?|csv)$/i.test(f.name)) return 'sheet'; return 'other'; }
  const fileSize = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
  function fileCard(f) {
    const k = fileKind(f), label = { pdf: 'PDF', doc: 'DOC', sheet: 'XLS', other: 'FILE' }[k];
    return `<a class="filecard" href="${f.url}" target="_blank" rel="noopener" download="${esc(f.name)}"><span class="fileicon ${k === 'pdf' ? '' : k}">${label}</span><span class="t"><b>${esc(f.name)}</b><span class="note">${fileSize(f.size)} · Tap to open</span></span></a>`;
  }
  function addFiles(gid, files) {
    [...files].slice(0, 10).forEach(file => {
      if (file.size > 25 * 1048576) return toast(`${file.name} is over 25 MB`);
      S.messages[gid].push({ id: uid(), from: 'me', ts: Date.now(), likes: [], file: { name: file.name, type: file.type || '', size: file.size, url: URL.createObjectURL(file) } });
    });
    UI.menu = false; UI.toBottom = true; render();
    const g = grp(gid), cand = others(g).filter(p => statusOf(p)?.s !== 'busy'), last = S.messages[gid].at(-1);
    if (cand.length) setTimeout(() => { last.likes.push(pick(cand)); if (UI.group === gid) render(); }, 1500);
  }
  const TXNS = () => { const t = new Date(); const d = n => ymd(addDays(t, -n)); return [
    { id: 't1', name: 'Komodo', amt: 186.40, date: d(1), cat: '🍽️' }, { id: 't2', name: 'Uber', amt: 23.18, date: d(1), cat: '🚗' },
    { id: 't3', name: 'Whole Foods', amt: 64.92, date: d(2), cat: '🛒' }, { id: 't4', name: 'AMC Theatres', amt: 54.00, date: d(4), cat: '🎬' },
    { id: 't5', name: 'Zelle from Jordan', amt: -21.00, date: d(5), cat: '↩️' }]; };
  function bankCard() {
    if (!S.bank) return `<div class="card" style="flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap"><span style="font-size:26px">🏦</span><div style="flex:1;min-width:200px"><b>Link your bank</b><div class="note">Split a card charge in one tap, and let Zelle paybacks confirm on their own.</div></div><button class="btn primary" data-act="bank">Link with Plaid</button></div>`;
    const tx = TXNS().filter(x => x.amt > 0 && !S.splitTx[x.id]);
    return `<div class="card"><div class="sechead"><span class="label">Recent charges · ${esc(S.bank.name)} ••${S.bank.mask}</span><button class="note" data-act="unlink" style="text-decoration:underline">Unlink</button></div>
      ${tx.length ? tx.slice(0, 4).map(x => `<div class="prow"><span class="gicon" style="width:36px;height:36px;font-size:17px">${x.cat}</span><span class="n">${esc(x.name)}<div class="note">${esc(fmtDay(x.date))}</div></span><b style="font-variant-numeric:tabular-nums">${money(x.amt)}</b><button class="btn line sm" data-act="splittx" data-t="${x.id}">Split</button></div>`).join('') : '<p class="note">No new charges to split.</p>'}</div>`;
  }
  const untilFor = k => k === '1h' ? Date.now() + 3600e3 : k === '3h' ? Date.now() + 3 * 3600e3 : endOfDay();

  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]'); if (!el) { if (UI.menu && !ev.target.closest('.menu')) { UI.menu = false; render(); } return; }
    const a = el.dataset.act, d = el.dataset;
    if (el.dataset.ov && ev.target !== el) return; // clicks inside an open sheet
    if (UI.sheet?.kind === 'event' && ['emoji'].includes(a)) syncEvent();
    switch (a) {
      case 'view': UI.view = d.v; UI.menu = false; UI.resetScroll = true; if (d.v !== 'group' && !wide()) UI.group = null; break;
      case 'opengroup': openGroup(d.g); break;
      case 'back': UI.view = 'groups'; UI.group = null; break;
      case 'gtab': UI.gtab = d.t; UI.toBottom = true; UI.resetScroll = true; break;
      case 'hidewelcome': UI.welcome = false; break;
      case 'members': UI.sheet = { kind: 'members' }; break;
      case 'menu': UI.menu = !UI.menu; break;
      case 'rsvp': { const e = evt(d.ev); setRsvp(e, d.v); return toast(d.v === 'g' ? `You're going to ${e.title}` : d.v === 'm' ? `Maybe for ${e.title}` : `You can't make ${e.title}`); }
      case 'like': { const m = S.messages[UI.group].find(x => x.id === d.m); const i = m.likes.indexOf('me'); i > -1 ? m.likes.splice(i, 1) : m.likes.push('me'); break; }
      case 'vote': { const m = S.messages[UI.group].find(x => x.id === d.m); m.poll.opts.forEach(o => { const i = o.v.indexOf('me'); if (i > -1) o.v.splice(i, 1); }); m.poll.opts[+d.i].v.push('me'); break; }
      case 'frommsg': {
        const m = S.messages[UI.group].find(x => x.id === d.m), w = (/\b(tonight|today|tomorrow|monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i.exec(m.text) || [''])[0].toLowerCase();
        const idx = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'].indexOf(w);
        newEventSheet({ group: UI.group, date: w === 'tomorrow' ? ymd(addDays(new Date(), 1)) : idx > -1 ? ymd(nextDow(idx)) : today(), title: '' }); break;
      }
      case 'hang': { const g = grp(d.g), i = g.hangout.indexOf('me'); if (i > -1) { g.hangout.splice(i, 1); return toast('You left the hangout'); } g.hangout.push('me'); const f = others(g).find(p => statusOf(p)?.s === 'free' && !g.hangout.includes(p)); if (f) setTimeout(() => { g.hangout.push(f); toast(`${nameOf(f)} joined the hangout`); }, 2000); return toast('You joined the hangout. This demo has no real audio.'); }
      case 'status': UI.menu = false; UI.sheet = { kind: 'status' }; break;
      case 'setstatus': S.my = { s: d.s, until: untilFor(UI.dur) }; UI.sheet = null; UI.welcome = UI.welcome; return toast(`${STATUS[d.s].long} until ${clock(S.my.until)}`);
      case 'dur': UI.dur = d.v; if (statusOf('me')) S.my.until = untilFor(d.v); break;
      case 'clearstatus': S.my = { s: null, until: 0 }; UI.sheet = null; return toast('Status cleared');
      case 'newevent': newEventSheet({ group: d.g, date: d.date }); break;
      case 'emoji': UI.sheet.emoji = d.v; break;
      case 'newpoll': UI.menu = false; UI.sheet = { kind: 'poll' }; break;
      case 'newgroup': UI.sheet = { kind: 'group', emoji: '🏃', members: [] }; break;
      case 'gemoji': { const n = document.getElementById('gname')?.value; UI.sheet.emoji = d.v; render(); if (n) document.getElementById('gname').value = n; return; }
      case 'addp': { const n = document.getElementById('gname')?.value, l = UI.sheet.members, i = l.indexOf(d.p); i > -1 ? l.splice(i, 1) : l.push(d.p); render(); if (n) document.getElementById('gname').value = n; return; }
      case 'openev': UI.modal = d.ev; break;
      case 'newsplit': newSplitSheet({ group: d.g, event: d.ev }); break;
      case 'sp': { syncSplit(false); const l = UI.sheet.people, i = l.indexOf(d.p); i > -1 ? l.splice(i, 1) : l.push(d.p); break; }
      case 'smode': syncSplit(false); UI.sheet.mode = d.v; break;
      case 'tip': syncSplit(false); UI.sheet.tip = d.v; if (d.v === 'custom') setTimeout(() => document.getElementById('tipc')?.focus(), 0); break;
      case 'payback': UI.sheet = { kind: 'pay', bill: d.b }; break;
      case 'paywith': {
        const b = bill(UI.sheet.bill);
        if (d.v === 'Zelle') { UI.sheet = { kind: 'zelle', bill: b.id }; break; }
        markMine(b, 'Cash'); break;
      }
      case 'markmine': markMine(bill(d.b), d.v); break;
      case 'bank': UI.modal = null; UI.sheet = { kind: 'bank', back: UI.sheet }; break;
      case 'linkbank': { const back = UI.sheet.back; S.bank = { name: d.v, mask: d.mask }; UI.sheet = back && back.kind !== 'bank' ? back : null; return toast(`${d.v} ••${d.mask} linked`); }
      case 'unlink': S.bank = null; return toast('Bank unlinked');
      case 'splittx': { const x = TXNS().find(t => t.id === d.t); newSplitSheet({ group: UI.view === 'group' ? UI.group : undefined }); Object.assign(UI.sheet, { title: x.name, total: String(x.amt), tip: '0', tx: x.id }); break; }
      case 'copyzelle': { const v = d.v; try { navigator.clipboard.writeText(v).then(() => toast('Copied ' + v), () => toast(v)); } catch (e) { toast(v); } return; }
      case 'remindme': { const b = bill(d.b), sh = b.shares.find(x => x.p === 'me'); S.reminders.push({ id: 'r' + uid(), emoji: '🧾', title: `Pay ${nameOf(b.paidBy)} back ${money(sh.amt)}`, date: ymd(addDays(new Date(), 1)), time: '09:00', repeat: '', group: '', doneOn: {} }); UI.sheet = null; return toast('Reminder set for tomorrow at 9 AM'); }
      case 'newreminder': UI.menu = false; UI.sheet = { kind: 'reminder', emoji: '💪', title: '', date: d.date || today(), time: '18:00', repeat: '', group: d.g || '' }; break;
      case 'remoji': syncRem(); UI.sheet.emoji = d.v; break;
      case 'rrep': syncRem(); UI.sheet.repeat = d.v; break;
      case 'remdone': { const r = rem(d.r); if (r.doneOn[d.day]) delete r.doneOn[d.day]; else { r.doneOn[d.day] = true; toast(r.repeat ? `Nice. ${r.title} done for ${fmtDay(d.day).toLowerCase()}` : `Done: ${r.title}`); return; } break; }
      case 'remdel': { const r = rem(d.r); S.reminders = S.reminders.filter(x => x !== r); if (r.event) { const e = evt(r.event); if (e) e.remind = ''; } return toast('Reminder deleted'); }
      case 'pickfile': { UI.menu = false; const inp = document.getElementById('upfile'); if (inp) { inp.accept = d.accept || ''; inp.value = ''; inp.click(); } return; }
      case 'viewimg': UI.viewer = d.m; break;
      case 'remindpay': { const b = bill(d.b), sh = b.shares.find(x => x.p === d.p); S.messages[b.group].push({ id: uid(), sys: `Reminder sent to ${nameOf(d.p)}: ${money(sh.amt)} for ${b.title}`, ts: Date.now() }); return toast(`Reminder sent to ${nameOf(d.p)}`); }
      case 'markpaid': { const sh = bill(d.b).shares.find(x => x.p === d.p); sh.paid = true; sh.method = 'Marked by you'; return toast(`${nameOf(d.p)} marked as paid`); }
      case 'remind': { const e = evt(d.ev); e.remind = d.v; setEventReminder(e, d.v); return toast(d.v ? `We'll remind you ${({ '1d': '1 day', '2h': '2 hours', '30m': '30 minutes' })[d.v]} before ${e.title}` : 'Reminder off'); }
      case 'addcal': return toast('Added to your calendar');
      case 'copylink': { const t = `Join me on Nexus: ${evt(d.ev).title}, ${whenText(evt(d.ev))}`; try { navigator.clipboard.writeText(t).then(() => toast('Invite copied. Paste it in any chat.'), () => toast('Invite links work once Nexus launches')); } catch (e) { toast('Invite links work once Nexus launches'); } return; }
      case 'close': if (UI.viewer) { UI.viewer = null; break; } UI.sheet = null; UI.modal = null; break;
      case 'pickday': UI.day = d.day; UI.cal = d.day.slice(0, 7); break;
      case 'mon': if (d.d === '0') { UI.cal = today().slice(0, 7); UI.day = today(); } else { const [y, m] = UI.cal.split('-').map(Number); UI.cal = ymd(new Date(y, m - 1 + +d.d, 1)).slice(0, 7); } break;
      case 'restart': S = seed(); UI.view = 'home'; UI.group = null; UI.welcome = true; return toast('Fresh demo started');
      default: return;
    }
    render();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && (UI.sheet || UI.modal || UI.menu || UI.viewer)) { if (UI.viewer) UI.viewer = null; else { UI.sheet = null; UI.modal = null; UI.menu = false; } render(); } });
  let lastWide = wide(); addEventListener('resize', () => { if (wide() !== lastWide) { lastWide = wide(); render(); } });
  setInterval(() => { if (!UI.sheet && !UI.modal && document.activeElement?.tagName !== 'INPUT') render(); }, 60000);
  render();
})();
</script>
<script>window.NEXUS_INTRO = 'short';</script><script src="../space.js?v=3"></script>
