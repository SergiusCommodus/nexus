        var p = DEMO ? Promise.resolve({ token: 'demo-' + Date.now(), id: 'demo' }) : rpc('guest_rsvp', { code: CODE, guest_name: nm, guest_email: em || null, answer: state.answer, token: state.token, adult: !!(ad && ad.checked) });
        p.then(function (r) {
          state.token = r.token; state.name = nm; state.done = { token: r.token, name: nm, email: !!em, answer: state.answer }; store.set(JSON.stringify(state.done));
          if (em && !DEMO) fetch(SB + '/functions/v1/astro-mail', { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'confirm', token: r.token }) }).catch(function () {});
          return DEMO ? sampleAfter(nm) : rpc('guest_event', { code: CODE });
        }).then(function (ev2) { state.ev = ev2; render(); window.scrollTo(0, 0); })
        .catch(function (x) { err.textContent = x.message; err.classList.remove('hidden'); btn.disabled = false; btn.textContent = 'Send my RSVP'; });
      };
    }
  }
  function sampleAfter(nm) { var ev = sample(); ev.guests = ev.guests.filter(function (g) { return g.name !== nm; }).concat([{ name: nm, answer: state.answer }]); return ev; }

  if (!CODE) { main.innerHTML = '<div class="card"><b>This link is missing its code.</b><p class="note" style="margin:0">Ask the host to send the invite again.</p></div>'; return; }
  if (q.get('unsub')) {
    (DEMO ? Promise.resolve() : rpc('guest_unsubscribe', { tok: q.get('unsub') })).then(function () { main.innerHTML = '<div class="card"><b>You\'re unsubscribed.</b><p class="note" style="margin:0">No more emails about this plan. <a href="?c=' + esc(CODE) + '">Back to the plan</a></p></div>'; })
      .catch(function (x) { main.innerHTML = '<div class="card err">' + esc(x.message) + '</div>'; });
    return;
  }
  (DEMO ? Promise.resolve(state.done ? sampleAfter(state.done.name) : sample()) : rpc('guest_event', { code: CODE })).then(function (ev) { state.ev = ev; render(); })
    .catch(function (x) { main.innerHTML = '<div class="card"><b>' + esc(x.message) + '</b><p class="note" style="margin:0">Ask the host for a fresh link, or <a href="../app/">open Astro</a>.</p></div>'; });
})();
</script>
<script>window.ASTRO_INTRO = 'off';</script><script src="../space.js?v=10"></script>
